name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.0-dev.387+31f157d80

jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.ts.outputs.value }}
    steps:
      - id: ts
        run: echo "value=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v3
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: tar -czf ct2html-${{ matrix.optimize }}.tar.gz ct2html
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.ts }}
          name: ${{ needs.prepare.outputs.ts }}
          files: ct2html-${{ matrix.optimize }}.tar.gz